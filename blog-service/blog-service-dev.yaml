server:
  port: ${port}

spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: https://localhost:9090/oauth2/jwks
          issuer-uri: https://localhost:9090


springdoc:
  swagger-ui:
    oauth:
      clientId: swagger
      use-pkce-with-authorization-code-grant: true

swagger:
  oauth2:
    authorization-uri: https://localhost:9090/oauth2/authorize
    token-uri: https://localhost:9090/oauth2/token

      
logging:
  level:
    root: DEBUG
  org:
    hibernate:
      SQL: DEBUG
      type: TRACE
    springframework:
      security: DEBUG
      web: DEBUG
